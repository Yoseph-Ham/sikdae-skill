[project]
name = "sikdae-expense-report"
version = "2.0.0"
description = "Claude Skill: 영수증 이미지를 Claude 비전으로 판독해 일 한도 정산 대장(xlsx)을 만든다"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
